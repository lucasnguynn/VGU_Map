<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VGU MSI Holographic Map - Digital Twin Facility Inspection</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            vgu: {
              orange: '#F37021',
              cyan: '#06B6D4',
              blue: '#0F1E36',
              dark: '#070A12'
            }
          },
          fontFamily: {
            sans: ['Be Vietnam Pro', 'sans-serif'],
            mono: ['Space Mono', 'monospace']
          }
        }
      }
    }
  </script>
  
  <!-- Three.js Import Map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  
  <!-- Custom Styles -->
  <style>
    /* ═══════════════════════════════════════════════════════════════
       VGU MAP - HOLOGRAPHIC UI STYLESHEET
       ═══════════════════════════════════════════════════════════════ */
    
    :root {
      --vgu-orange: #F37021;
      --vgu-cyan: #06B6D4;
      --vgu-blue: #0F1E36;
      --vgu-dark: #070A12;
      --font-sans: 'Be Vietnam Pro', sans-serif;
      --font-mono: 'Space Mono', monospace;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
    
    body {
      font-family: var(--font-sans);
      background-color: var(--vgu-dark);
      color: #F8FAFC;
    }
    
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }
    
    /* Header */
    .app-header {
      background: white;
      border-bottom: 1px solid #dde2ec;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 24px;
      height: 62px;
      box-shadow: 0 2px 8px rgba(0, 37, 84, 0.06);
      position: relative;
      z-index: 10;
      flex-shrink: 0;
    }
    
    .header-logo {
      height: 42px;
      width: auto;
    }
    
    .header-title {
      font-size: 18px;
      font-weight: 700;
      color: #002554;
    }
    
    .title-accent {
      color: var(--vgu-orange);
    }
    
    /* Main Content */
    .main-content {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    
    /* Map Container */
    #map-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      background-color: var(--vgu-dark);
    }
    
    #three-canvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }
    
    /* Top HUD Bar */
    .top-hud-bar {
      position: absolute;
      top: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: 92%;
      max-width: 48rem;
      pointer-events: none;
    }
    
    .hud-context-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      border-radius: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      pointer-events: auto;
      background: rgba(15, 30, 54, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(239, 90, 36, 0.3);
      box-shadow: 0 8px 32px 0 rgba(7, 10, 18, 0.5);
      transition: all 0.3s ease;
    }
    
    .hud-context-left {
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }
    
    .pulse-dot {
      width: 0.375rem;
      height: 0.375rem;
      border-radius: 50%;
      background-color: var(--vgu-orange);
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .hud-context-title {
      color: var(--vgu-orange);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .hud-context-guidance {
      color: var(--vgu-cyan);
      font-weight: 600;
      font-size: 0.5625rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    
    /* Info Panel (Sidebar / Bottom Sheet) */
    #info-panel {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 100%;
      max-width: 24rem;
      background: rgba(7, 10, 18, 0.95);
      backdrop-filter: blur(12px);
      border-left: 1px solid rgba(239, 90, 36, 0.3);
      box-shadow: -8px 0 32px rgba(7, 10, 18, 0.5);
      z-index: 30;
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      overflow-y: auto;
    }
    
    #info-panel.visible {
      transform: translateX(0);
    }
    
    .info-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem;
      border-bottom: 1px solid rgba(239, 90, 36, 0.2);
    }
    
    .info-panel-title {
      font-family: var(--font-mono);
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--vgu-cyan);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .close-panel-btn {
      width: 2rem;
      height: 2rem;
      border-radius: 0.375rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .close-panel-btn:hover {
      background: rgba(239, 90, 36, 0.1);
      border-color: var(--vgu-orange);
      color: var(--vgu-orange);
    }
    
    .info-panel-content {
      padding: 1rem;
    }
    
    .info-section {
      margin-bottom: 1.5rem;
    }
    
    .info-label {
      font-family: var(--font-mono);
      font-size: 0.625rem;
      color: var(--vgu-cyan);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }
    
    .info-value {
      font-size: 0.875rem;
      color: #F8FAFC;
      line-height: 1.5;
    }
    
    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-family: var(--font-mono);
      font-size: 0.625rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .status-active {
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid var(--vgu-cyan);
      color: var(--vgu-cyan);
    }
    
    .status-inactive {
      background: rgba(239, 90, 36, 0.1);
      border: 1px solid var(--vgu-orange);
      color: var(--vgu-orange);
    }
    
    /* Loading Overlay */
    #loading-overlay {
      position: absolute;
      inset: 0;
      background: var(--vgu-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 40;
    }
    
    .loading-text {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--vgu-cyan);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    
    .loading-bar-container {
      width: 100%;
      max-width: 20rem;
      height: 0.25rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 9999px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .loading-progress {
      height: 100%;
      background: linear-gradient(to right, var(--vgu-orange), var(--vgu-cyan));
      transition: width 0.3s ease;
    }
    
    /* Hidden Utility */
    .hidden {
      display: none !important;
    }
    
    /* Cyberpunk Effects */
    .cyber-grid {
      background-image: 
        linear-gradient(rgba(239, 90, 36, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(239, 90, 36, 0.05) 1px, transparent 1px);
      background-size: 30px 30px;
      background-position: center;
    }
    
    /* Mobile Responsive */
    @media (max-width: 640px) {
      #info-panel {
        max-width: 100%;
        top: auto;
        bottom: 0;
        transform: translateY(100%);
        transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }
      
      #info-panel.visible {
        transform: translateY(0);
      }
      
      .hud-context-guidance {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="app" class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="flex items-center gap-3">
        <img src="VGU-Full-Color-logo-05-_1_.svg" alt="VGU Logo" class="header-logo">
        <h1 class="header-title">VGU <span class="title-accent">MSI</span> Holographic Map</h1>
      </div>
    </header>
    
    <!-- Main Content -->
    <main class="main-content">
      <!-- 3D Map Container -->
      <div id="map-container">
        <canvas id="three-canvas"></canvas>
        
        <!-- Loading Overlay -->
        <div id="loading-overlay">
          <div class="cyber-grid" style="position:absolute;inset:0;opacity:0.05;"></div>
          <span class="loading-text">SYS_LOAD: INITIALIZING_HOLOGRAPHIC_MAP</span>
          <div class="loading-bar-container">
            <div id="loading-progress" class="loading-progress" style="width: 0%;"></div>
          </div>
          <span class="text-[10px] font-mono text-white/50 tracking-widest">
            TELEMETRY_STREAM: <span id="loading-percent-value">0</span>%
          </span>
        </div>
        
        <!-- Top HUD Bar -->
        <div class="top-hud-bar">
          <div class="hud-context-panel">
            <div class="hud-context-left">
              <span class="pulse-dot"></span>
              <span class="hud-context-title" id="hud-context-title">FOCUS: VGU CAMPUS OVERVIEW</span>
            </div>
            <div class="hud-context-guidance" id="hud-context-guidance">CLICK A ROOM TO VIEW DETAILS</div>
          </div>
        </div>
      </div>
      
      <!-- Info Panel (Sidebar / Bottom Sheet) -->
      <div id="info-panel">
        <div class="info-panel-header">
          <div class="info-panel-title" id="panel-room-title">ROOM_DETAILS</div>
          <button id="close-panel-btn" class="close-panel-btn">✕</button>
        </div>
        <div class="info-panel-content" id="panel-content">
          <!-- Dynamic content injected here -->
        </div>
      </div>
    </main>
  </div>
  
  <!-- Main JavaScript Entry Point -->
  <script type="module" src="js/main.js"></script>
  
  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(registration => {
          console.log('[SW] ServiceWorker registration successful:', registration.scope);
        }).catch(err => {
          console.log('[SW] ServiceWorker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
