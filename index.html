<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VGU Facilities Hologram Map</title>
    
    <!-- Tailwind CSS (CDN - Không cần build) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { 
                extend: { 
                    colors: { vguOrange: '#F37021', darkBg: '#070A12', cyberCyan: '#06B6D4' },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                } 
            }
        }
    </script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #070A12; color: white; touch-action: none; }
        /* Tùy chỉnh thanh cuộn cho đẹp */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #06B6D4; border-radius: 4px; }
    </style>
</head>
<body class="bg-darkBg">

    <!-- Header UI -->
    <header class="absolute top-0 w-full h-16 bg-[#0F1E36]/80 backdrop-blur-md border-b border-vguOrange/20 z-10 flex items-center justify-between px-6 pointer-events-auto">
        <div class="flex items-center gap-3">
            <div class="bg-vguOrange text-white px-3 py-1 rounded text-sm font-bold tracking-wider shadow-[0_0_10px_#F37021]">VGU</div>
            <div>
                <h1 class="text-sm font-bold text-white tracking-widest">FACILITIES MAP</h1>
                <span class="text-[10px] text-cyberCyan tracking-widest uppercase">Hologram Engine v1.0</span>
            </div>
        </div>
    </header>

    <!-- Canvas chứa bản đồ 3D -->
    <div id="canvas-container" class="absolute inset-0 w-full h-full z-0"></div>

    <!-- UI Overlay loading -->
    <div id="loading-screen" class="absolute inset-0 z-50 flex items-center justify-center bg-darkBg text-cyberCyan font-mono tracking-widest transition-opacity duration-500">
        INITIALIZING SPATIAL DATA...
    </div>

    <!-- Bottom Sheet / Sidebar hiển thị thông tin phòng -->
    <div id="info-panel" class="absolute bottom-0 md:right-0 md:bottom-auto w-full md:w-96 h-[60%] md:h-full bg-[#0F1E36]/95 backdrop-blur-xl border-t md:border-t-0 md:border-l border-cyberCyan/30 z-20 transform translate-y-full md:translate-y-0 md:translate-x-full transition-transform duration-300 flex flex-col shadow-[-10px_0_30px_rgba(0,0,0,0.8)]">
        
        <!-- Nút đóng -->
        <button id="btn-close" class="absolute top-4 right-4 text-white/50 hover:text-vguOrange transition-colors text-xl font-bold cursor-pointer">✕</button>
        
        <!-- Nội dung Render từ info_data.json -->
        <div id="panel-content" class="p-6 overflow-y-auto h-full mt-12 md:mt-16">
            <!-- JS sẽ bơm dữ liệu vào đây -->
        </div>
    </div>

    <!-- Cấu hình Import Map cho Three.js (ES6 Module) -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    
    <!-- File xử lý lõi -->
    <script type="module" src="./main.js"></script>

</body>
</html>
