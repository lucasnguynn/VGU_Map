name: Update Info Data (Google Sheets → site)

on:
  schedule:
    # Chạy mỗi 15 phút. GitHub Actions thường trễ vài phút với lịch dày,
    # và mỗi lần CÓ thay đổi sẽ kích hoạt deploy, nên 15' là mức cân bằng hợp lý.
    # Muốn nhanh hơn đổi thành '*/5 * * * *'; chậm hơn '0 * * * *' (mỗi giờ).
    - cron: '*/15 * * * *'
  workflow_dispatch: {}   # Cho phép bấm chạy tay

# QUAN TRỌNG: commit thẳng lên nhánh deploy (main) để dữ liệu mới LÊN SÓNG.
# Trước đây job này checkout/push nhánh "Test" trong khi deploy build từ "main"
# nên dữ liệu cập nhật không bao giờ hiển thị.
env:
  TARGET_BRANCH: OMG

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-info-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync data from Google Sheets
        env:
          # Đặt URL Web App của Code.gs tại:
          # Settings → Secrets and variables → Actions → Variables → APPS_SCRIPT_URL
          APPS_SCRIPT_URL: ${{ vars.APPS_SCRIPT_URL }}
        run: node scripts/sync_all_data.js

      - name: Commit & push if data changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action (data sync)"
          git add public/data/info_data.json content/Rooms
          if git diff --staged --quiet; then
            echo "Không có thay đổi — bỏ qua commit."
          else
            git commit -m "chore(data): auto-sync rooms from Google Sheets"
            # KHÔNG dùng [skip ci]: cần deploy.yml chạy để đẩy dữ liệu mới lên Pages.
            git pull --rebase origin "$TARGET_BRANCH"
            git push origin HEAD:"$TARGET_BRANCH"
          fi
