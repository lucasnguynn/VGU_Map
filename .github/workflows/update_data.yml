name: Update Info Data

on:
  schedule:
    - cron: '*/5 * * * *'  # Run every 5 minutes
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false  # Wait for in-progress run to finish before starting new one

jobs:
  update-info-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: New  # 🔥 Đảm bảo luôn lấy đúng code từ nhánh New khi chạy tự động
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run unified data sync script
        run: node sync_all_data.js
        env:
          MAP_API_URL: ${{ secrets.MAP_API_URL }}
          INFO_API_URL: ${{ secrets.INFO_API_URL }}
          DRIVE_API_URL: ${{ secrets.DRIVE_API_URL }}

      - name: Stamp PWA build version into sw.js and index.html
        run: node build_pwa.js

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add info_data.json drive_data.json map_data.json sw.js index.html
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update data and stamp PWA version [skip ci]"
            git pull --rebase origin New # 🔥 Đổi từ main sang New
            git push origin New           # 🔥 Chỉ định rõ đẩy về nhánh New
          else
            echo "No changes to commit"
          fi
