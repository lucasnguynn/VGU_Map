name: Update Info Data

on:
  schedule:
    - cron: '*/5 * * * *'  # Run every 5 minutes
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false  # Wait for in-progress run to finish before starting Neww one

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      shell_changed: ${{ steps.filter.outputs.shell }}
      data_changed: ${{ steps.filter.outputs.data }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Neww
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shell:
              - 'index.html'
              - 'sw.js'
              - 'manifest.json'
              - 'build_pwa.js'
            data:
              - 'map_data.json'
              - 'info_data.json'
              - 'drive_data.json'

  update-info-data:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.data_changed == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: Neww  # 🔥 Đảm bảo luôn lấy đúng code từ nhánh Neww khi chạy tự động
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run unified data sync script
        run: node sync_all_data.js
        env:
          MAP_API_URL: ${{ secrets.MAP_API_URL }}
          INFO_API_URL: ${{ secrets.INFO_API_URL }}
          DRIVE_API_URL: ${{ secrets.DRIVE_API_URL }}

      - name: Stamp PWA build version into sw.js and index.html
        if: ${{ needs.detect-changes.outputs.shell_changed == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          BUILD_VERSION="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_ENV"
          BUILD_VERSION="$BUILD_VERSION" node build_pwa.js

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add info_data.json drive_data.json map_data.json sw.js index.html
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update data and stamp PWA version [skip ci]"
            git pull --rebase origin Neww # 🔥 Đổi từ main sang Neww
            git push origin Neww           # 🔥 Chỉ định rõ đẩy về nhánh Neww
          else
            echo "No changes to commit"
          fi
