name: Deploy Nuxt 3 to GitHub Pages

on:
  push:
    branches:
      - main # Đổi thành 'master' nếu nhánh chính của bạn tên là master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      # Đổi thành npx nuxi (CLI chuẩn của Nuxt 3)
      - name: Generate Static HTML
        run: npx nuxi generate

      # [THÊM MỚI] Chốt chặn an toàn: Tắt Jekyll và kiểm tra file
      - name: Fix GitHub Pages requirements and Debug
        run: |
          touch .output/public/.nojekyll
          echo "Danh sách các file chuẩn bị upload:"
          ls -la .output/public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
